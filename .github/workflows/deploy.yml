name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Every night at 03:00 in Costa Rica (09:00 UTC), so the Activity section's
  # GitHub and npm numbers stay fresh (src/utils/activity.ts).
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Lifts GitHub's API limit for the latest push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The nightly run exists only to refresh the numbers: if GitHub or npm
          # can't be reached, it stops and the site keeps yesterday's version.
          ACTIVITY_REQUIRED: ${{ github.event_name == 'schedule' }}
      # A broken internal link stops the deploy; the site online stays as it was.
      - run: npm run check:links
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
