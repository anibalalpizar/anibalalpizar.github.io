name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Every night at 02:23 in Costa Rica (08:23 UTC), so the Activity section's
  # GitHub and npm numbers stay fresh (src/utils/activity.ts).
  # Off the hour: GitHub delays scheduled runs most at the top of the hour.
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Lifts GitHub's API limit for the latest push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The nightly run exists only to refresh the numbers: if GitHub or npm
          # can't be reached, it stops and the site keeps yesterday's version.
          ACTIVITY_REQUIRED: ${{ github.event_name == 'schedule' }}
      # A broken internal link stops the deploy; the site online stays as it was.
      - run: npm run check:links
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub turns off scheduled workflows in a repository with no activity for
  # 60 days. Enabling this one again each night restarts that count, without
  # filler commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
